<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不等式・数直線ワークベンチ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="hero">
            <p class="hero-kicker">Linear Inequality Workbench</p>
            <h1>不等式・数直線ワークベンチ</h1>
            <p class="hero-copy">1次不等式を解いて、最終的な解を数直線と区間表記で確認できます。</p>
        </header>

        <main class="layout">
            <section class="card controls-card">
                <div class="card-head">
                    <div>
                        <p class="section-label">入力</p>
                        <h2>条件を組み立てる</h2>
                    </div>
                    <div class="control-group compact">
                        <label for="mode-select">モード</label>
                        <select id="mode-select">
                            <option value="single">1つの不等式</option>
                            <option value="and">共通範囲（かつ）</option>
                            <option value="or">合わせた範囲（または）</option>
                        </select>
                    </div>
                </div>

                <p class="input-guide">各条件を <strong>ax + b ? cx + d</strong> の形で入力します。係数や定数には小数も使えます。</p>

                <div class="equations-stack">
                    <article class="ineq-card" id="eq1-card">
                        <div class="ineq-header">
                            <span class="ineq-badge">条件 1</span>
                            <p id="eq1-preview" class="ineq-preview"></p>
                        </div>
                        <div class="eq-input-row">
                            <div class="expr-side">
                                <input type="number" id="lcoef1" value="2" step="any" aria-label="条件1の左辺のxの係数">
                                <span class="term-label">x</span>
                                <span class="term-sign">+</span>
                                <input type="number" id="lconst1" value="3" step="any" aria-label="条件1の左辺の定数項">
                            </div>

                            <select id="op1" aria-label="条件1の不等号">
                                <option value=">">&gt;</option>
                                <option value=">=">&ge;</option>
                                <option value="<">&lt;</option>
                                <option value="<=">&le;</option>
                            </select>

                            <div class="expr-side">
                                <input type="number" id="rcoef1" value="0" step="any" aria-label="条件1の右辺のxの係数">
                                <span class="term-label">x</span>
                                <span class="term-sign">+</span>
                                <input type="number" id="rconst1" value="5" step="any" aria-label="条件1の右辺の定数項">
                            </div>
                        </div>
                    </article>

                    <div id="logical-operator" class="logical-operator hidden">かつ</div>

                    <article class="ineq-card hidden" id="eq2-card">
                        <div class="ineq-header">
                            <span class="ineq-badge alt">条件 2</span>
                            <p id="eq2-preview" class="ineq-preview"></p>
                        </div>
                        <div class="eq-input-row">
                            <div class="expr-side">
                                <input type="number" id="lcoef2" value="1" step="any" aria-label="条件2の左辺のxの係数">
                                <span class="term-label">x</span>
                                <span class="term-sign">+</span>
                                <input type="number" id="lconst2" value="0" step="any" aria-label="条件2の左辺の定数項">
                            </div>

                            <select id="op2" aria-label="条件2の不等号">
                                <option value="<">&lt;</option>
                                <option value="<=">&le;</option>
                                <option value=">">&gt;</option>
                                <option value=">=">&ge;</option>
                            </select>

                            <div class="expr-side">
                                <input type="number" id="rcoef2" value="0" step="any" aria-label="条件2の右辺のxの係数">
                                <span class="term-label">x</span>
                                <span class="term-sign">+</span>
                                <input type="number" id="rconst2" value="6" step="any" aria-label="条件2の右辺の定数項">
                            </div>
                        </div>
                    </article>
                </div>

                <div class="examples-row">
                    <span class="examples-label">例題</span>
                    <button type="button" class="example-btn" data-example="single">基本</button>
                    <button type="button" class="example-btn" data-example="and">共通範囲</button>
                    <button type="button" class="example-btn" data-example="or">または</button>
                </div>
            </section>

            <section class="card output-card">
                <div class="card-head">
                    <div>
                        <p class="section-label">結果</p>
                        <h2>解き方と解の形</h2>
                    </div>
                </div>

                <div class="formula-grid">
                    <div class="formula-panel">
                        <p class="panel-label">入力した条件</p>
                        <div id="math-formula" class="math-display"></div>
                    </div>
                    <div class="formula-panel accent">
                        <p class="panel-label">最終的な解</p>
                        <div id="solution-formula" class="math-display"></div>
                    </div>
                </div>

                <div class="summary-grid">
                    <div class="summary-tile">
                        <p class="summary-label">区間表記</p>
                        <p id="interval-text" class="summary-value"></p>
                    </div>
                    <div class="summary-tile">
                        <p class="summary-label">判定</p>
                        <p id="status-text" class="summary-value"></p>
                    </div>
                </div>

                <div class="number-line-wrap">
                    <svg id="number-line" viewBox="0 0 860 280" preserveAspectRatio="xMidYMid meet" aria-label="不等式の数直線"></svg>
                </div>

                <div id="legend" class="legend"></div>

                <div class="explanation-box">
                    <div class="explanation-copy">
                        <h3>読み取り</h3>
                        <p id="explanation-text"></p>
                    </div>
                    <div id="steps-list" class="steps-list"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
